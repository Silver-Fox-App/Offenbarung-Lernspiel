<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Revelation Learning Game</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;padding:0;background:#f3f3f3;
  font-family:Arial,"Noto Sans",sans-serif
}
body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center
}
.topbar{
  width:min(1536px,100vw);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:8px 12px;
  background:#fff;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,.08)
}
.title{font-size:clamp(15px,2vw,23px);font-weight:800}
.score{font-size:clamp(12px,1.45vw,17px);white-space:nowrap}
#resetBtn{
  display:none;
  border:1px solid #aaa;
  border-radius:10px;
  background:#fff;
  color:#222;
  padding:8px 12px;
  font-size:clamp(12px,1.45vw,16px);
  font-weight:800;
  cursor:pointer
}
#resetBtn.show{display:inline-block}

.board-wrap{width:min(1536px,100vw)}
.board{
  position:relative;
  width:100%;
  aspect-ratio:1536/862;
  background:#fff url("vorlage.png") center/100% 100% no-repeat;
  overflow:hidden
}

.answer-field{
  position:absolute;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:4px 7px;
  border:0;
  outline:none;
  background:transparent;
  color:#202020;
  font-family:Arial,"Noto Sans",sans-serif;
  font-weight:700;
  font-size:clamp(10px,1.17vw,18px);
  line-height:1.12;
  white-space:pre-wrap;
  overflow:hidden;
  overflow-wrap:anywhere;
  word-break:normal;
  cursor:text;
  user-select:text
}
.answer-field:focus{background:rgba(255,255,255,.72)}
.answer-field.wrong{
  background:rgba(249,218,218,.96);
  color:#7a2222
}
.answer-field.correct{
  background:rgba(220,244,224,.96);
  color:#1f5d2a
}
.answer-field.revealed{
  background:rgba(255,238,204,.97);
  color:#6f4700
}
.answer-field.locked{cursor:default}
.small{font-size:clamp(8px,1.0vw,15px)}
.tiny{font-size:clamp(8px,.88vw,14px)}

.instruction{
  width:min(1536px,100vw);
  padding:9px 10px 13px;
  background:#fff;
  color:#444;
  text-align:center;
  font-size:clamp(11px,1.3vw,15px)
}
.instruction strong{color:#7a2222}
.back-button{
  position:fixed;
  top:2px;
  left:10px;
  z-index:9999;
  padding:10px 12px;
  border-radius:10px;
  background:#ffffff;
  color:#222222;
  text-decoration:none;
  font-size:12px;
  font-weight:500;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
  border:1px solid #dddddd;
}

.back-button:active{
  transform:scale(.97);
}
</style>
</head>
<body>

<a href="../" class="back-button">🍀Main Menu🍀</a>
  
<div class="topbar">
  <div class="title"></div>
  <div class="score">Correct: <span id="right">0</span>　Wrong: <span id="wrong">0</span></div>
  <button id="resetBtn" type="button">🔄 Restart (Reset)</button>
</div>

<div class="board-wrap">
<div class="board">

<!-- Top section -->
<div class="answer-field" id="f1" contenteditable="true" data-answer="Jesus"></div>

<div class="answer-field" id="f2" contenteditable="true" data-answer="Choosing"></div>
<div class="answer-field" id="f3" contenteditable="true" data-answer="Covenant"></div>
<div class="answer-field" id="f4" contenteditable="true" data-answer="Chosen People"></div>
<div class="answer-field" id="f5" contenteditable="true" data-answer="Betrayal"></div>

<div class="answer-field small" id="f6" contenteditable="true"
     data-answer="Destruction of the Chosen People by the Gentiles"></div>

<div class="answer-field" id="f7" contenteditable="true"
     data-answer="42 months (3 ½)"></div>

<div class="answer-field" id="f8" contenteditable="true" data-answer="Destroyer"></div>
<div class="answer-field" id="f9" contenteditable="true" data-answer="Judgment + Salvation"></div>
<div class="answer-field" id="f10" contenteditable="true" data-answer="Approx. 14 years"></div>
<div class="answer-field" id="f11" contenteditable="true" data-answer="Approx. 7 years"></div>
<div class="answer-field" id="f12" contenteditable="true" data-answer="Wedding"></div>

<!-- Dates -->
<div class="answer-field" id="f13" contenteditable="true" data-answer="March 1966"></div>
<div class="answer-field" id="f14" contenteditable="true" data-answer="Sept. 1980"></div>
<div class="answer-field" id="f15" contenteditable="true" data-answer="March 1984"></div>
<div class="answer-field" id="f16" contenteditable="true" data-answer="1991"></div>

<!-- Lower left -->
<div class="answer-field small" id="f17" contenteditable="true"
     data-answer="1:1–8 Summary &amp; Conclusion"></div>
<div class="answer-field small" id="f18" contenteditable="true"
     data-answer="2, 3 Letters"></div>
<div class="answer-field small" id="f19" contenteditable="true"
     data-answer="1:9–20 The choosing of the New John"></div>
<div class="answer-field small" id="f20" contenteditable="true"
     data-answer="4, 5 Spiritual World"></div>

<!-- Vertical labels -->
<div class="answer-field vertical" id="f21" contenteditable="true"
     data-answer="Temple of the Tabernacle"></div>
<div class="answer-field vertical" id="f22" contenteditable="true"
     data-answer="Isaac Church"></div>

<!-- 6 / 7 -->
<div class="answer-field" id="f23" contenteditable="true" data-answer="6"></div>
<div class="answer-field" id="f24" contenteditable="true" data-answer="7"></div>

<!-- 8,9 / 10 / 11 / 12,13 -->
<div class="answer-field" id="f25" contenteditable="true" data-answer="8, 9"></div>
<div class="answer-field" id="f26" contenteditable="true" data-answer="Trumpets"></div>

<div class="answer-field" id="f27" contenteditable="true" data-answer="10"></div>
<div class="answer-field" id="f28" contenteditable="true" data-answer="Revelation"></div>

<div class="answer-field" id="f29" contenteditable="true" data-answer="11"></div>
<div class="answer-field" id="f30" contenteditable="true" data-answer="Witness"></div>

<div class="answer-field" id="f31" contenteditable="true" data-answer="12, 13"></div>
<div class="answer-field" id="f32" contenteditable="true" data-answer="War"></div>

<!-- 16–18 -->
<div class="answer-field" id="f33" contenteditable="true" data-answer="16 Bowls"></div>
<div class="answer-field" id="f34" contenteditable="true" data-answer="17 Harlot"></div>
<div class="answer-field" id="f35" contenteditable="true" data-answer="18 Babylon"></div>

<!-- 19–22 -->
<div class="answer-field" id="f36" contenteditable="true" data-answer="19 Wedding"></div>
<div class="answer-field" id="f37" contenteditable="true" data-answer="20 Resurrection"></div>
<div class="answer-field" id="f38" contenteditable="true" data-answer="21 Eternal Life"></div>
<div class="answer-field" id="f39" contenteditable="true" data-answer="22 Healing"></div>

<!-- Bottom -->
<div class="answer-field" id="f40" contenteditable="true" data-answer="14, 15"></div>
<div class="answer-field tiny" id="f41" contenteditable="true"
     data-answer="Temple of the Tabernacle of the Testimony"></div>

</div>
</div>

<div class="instruction">
  Enter the answer in the empty field.
  On the <strong>1st mistake</strong>, the field turns red.
  On the <strong>2nd mistake</strong>, the correct answer is shown.
  When all fields are completed, you can restart with Reset.
</div>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/Offenbarung-Lernspiel/service-worker.js");
}

const fields=[...document.querySelectorAll(".answer-field")];
const rightEl=document.getElementById("right");
const wrongEl=document.getElementById("wrong");
const resetBtn=document.getElementById("resetBtn");

let right=0, wrong=0;

const POS={
  f1:[5.2,6.6,14.4,6.1],

  f2:[1.6,14.1,9.0,8.0],
  f3:[12.2,14.1,8.9,8.0],
  f4:[13.7,22.8,7.1,7.4],
  f5:[21.2,22.8,9.4,7.0],

  f6:[31.9,14.0,19.8,12.4],
  f7:[34.0,26.6,15.8,5.4],

  f8:[65.3,20.1,8.9,6.3],
  f9:[74.8,16.4,23.1,8.3],
  f10:[15.5,31.1,12.0,4.1],
  f11:[61.2,28.0,11.7,6.0],
  f12:[83.5,28.0,13.4,6.2],

  f13:[4.7,38.9,11.8,5.7],
  f14:[25.2,38.9,11.8,5.7],
  f15:[47.5,38.9,10.4,5.7],
  f16:[74.0,38.9,7.0,5.7],

  f17:[0.4,49.7,10.9,10.3],
  f18:[11.6,49.7,9.9,10.3],
  f19:[0.4,61.6,10.9,10.4],
  f20:[11.6,61.6,9.9,10.4],

  f21:[22.9,47.0,4.2,25.0],
  f22:[32.8,47.0,4.2,23.0],

  f23:[26.4,71.9,4.8,6.0],
  f24:[35.0,71.9,4.8,6.0],

  f25:[37.1,47.6,9.1,5.2],
  f26:[45.8,47.6,10.2,5.2],
  f27:[37.1,52.8,9.1,5.2],
  f28:[45.8,52.8,10.2,5.2],
  f29:[37.1,58.0,9.1,5.2],
  f30:[45.8,58.0,10.2,5.2],
  f31:[37.1,63.2,9.1,5.2],
  f32:[45.8,63.2,10.2,5.2],

  f33:[59.2,48.4,12.2,6.1],
  f34:[59.2,54.6,12.2,6.1],
  f35:[59.2,60.7,15.0,6.1],

  f36:[82.5,44.4,14.0,6.0],
  f37:[82.5,51.3,14.0,6.0],
  f38:[82.5,58.2,14.0,6.0],
  f39:[82.5,65.1,14.0,6.0],

  f40:[45.5,89.2,14.8,5.4],
  f41:[64.6,89.4,21.1,6.7]
};

/* Apply positions. */
for(const [id,p] of Object.entries(POS)){
  const f=document.getElementById(id);
  f.style.left=p[0]+"%";
  f.style.top=p[1]+"%";
  f.style.width=p[2]+"%";
  f.style.height=p[3]+"%";
}

/* Vertical fields are rotated so the text reads like the reference diagram. */
["f21","f22"].forEach(id=>{
  const f=document.getElementById(id);
  f.style.writingMode="vertical-rl";
  f.style.textOrientation="upright";
  f.style.transform="rotate(45deg)";
});

function normalize(v){
  return (v||"")
    .replace(/\u00a0/g," ")
    .replace(/\n/g," ")
    .trim()
    .toLowerCase()
    .replace(/\s+/g,"")
    .replace(/[.,:;!?·•~～'"“”‘’]/g,"")
    .replace(/[＋+]/g,"+")
    .replace(/[–—]/g,"-")
    .replace(/[()（）]/g,"");
}

function isCorrect(field){
  const entered=normalize(field.innerText);
  const answer=normalize(field.dataset.answer);

  if(entered===answer) return true;

  const id=field.id;
  const variants={

    f6:[
      "Destruction of the Chosen People by the Gentiles"
    ],

    f7:[
      "42 months",
      "42 months (3 ½)",
      "42 months (3 1/2)"
    ],

    f10:[
      "Approx. 14 years",
      "Approximately 14 years",
      "14 years"
    ],

    f11:[
      "Approx. 7 years",
      "Approximately 7 years",
      "7 years"
    ],

    f14:["Sept 1980","Sept. 1980"],
    f19:[
      "The choosing of the New John",
      "The choosing of the new John",
      "The choosing of New John",
      "New John",
      "The new John"
    ],
    f21:["Temple of the","Temple of the"],
    f25:["8, 9"],
    f31:["12, 13"],
    f33:["16 Bowls"],
    f34:["17 Harlot"],
    f35:["18 Babylon"],
    f36:["19 Wedding"],
    f37:["20 Resurrection"],
    f38:["21 Eternal Life"],
    f39:["22 Healing"],
    f41:["Temple of the Tabernacle"]
  };

  if(variants[id]){
    return variants[id].map(normalize).includes(entered);
  }

  return false;
}

function fitText(field){
  if(field.dataset.locked==="1") return;

  let size=parseFloat(getComputedStyle(field).fontSize);
  if(!Number.isFinite(size)) size=16;

  const min=field.classList.contains("tiny")?7:
            field.classList.contains("small")?8:9;

  field.style.fontSize=size+"px";

  let guard=0;
  while(
    guard<28 &&
    (field.scrollHeight>field.clientHeight+1 ||
     field.scrollWidth>field.clientWidth+1) &&
    size>min
  ){
    size-=0.5;
    field.style.fontSize=size+"px";
    guard++;
  }
}

function updateUI(){
  rightEl.textContent=right;
  wrongEl.textContent=wrong;
  resetBtn.classList.toggle(
    "show",
    fields.every(f=>f.dataset.locked==="1")
  );
}

function finishField(field){
  field.dataset.locked="1";
  field.contentEditable="false";
  field.classList.add("locked");
  fitText(field);
}

function checkField(field){
  if(field.dataset.locked==="1") return;
  if(!field.innerText.trim()) return;

  field.attempts=Number(field.dataset.attempts||0);

  if(isCorrect(field)){
    field.classList.remove("wrong","revealed");
    field.classList.add("correct");
    right++;
    finishField(field);
    updateUI();
    return;
  }

  field.attempts++;
  field.dataset.attempts=String(field.attempts);

  wrong++;
  field.classList.remove("correct","revealed");
  field.classList.add("wrong");

  fitText(field);

  if(field.attempts>=2){
    field.innerText=field.dataset.answer;
    field.classList.remove("wrong");
    field.classList.add("revealed");
    finishField(field);
  }

  updateUI();
}

fields.forEach(field=>{
  field.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      e.preventDefault();
      checkField(field);
    }
  });

  field.addEventListener("blur",()=>checkField(field));

  field.addEventListener("input",()=>{
    if(field.dataset.locked!=="1") fitText(field);
  });

  field.addEventListener("paste",()=>{
    setTimeout(()=>fitText(field),0);
  });
});

resetBtn.addEventListener("click",()=>{
  right=0;
  wrong=0;

  fields.forEach(field=>{
    field.innerText="";
    field.dataset.attempts="0";
    field.dataset.locked="0";
    field.contentEditable="true";
    field.classList.remove("wrong","correct","revealed","locked");
    field.style.fontSize="";
  });

  updateUI();
});

updateUI();
</script>
</body>
</html>
