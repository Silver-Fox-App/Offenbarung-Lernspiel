<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>요한계시록 학습 게임</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #f3f3f3;
    font-family: Arial, "Noto Sans KR", "Noto Sans CJK KR", sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .topbar {
    width: min(1536px, 100vw);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    background: #fff;
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }

  .title {
    font-size: clamp(16px, 2.2vw, 24px);
    font-weight: 800;
  }

  .score {
    font-size: clamp(13px, 1.7vw, 18px);
    white-space: nowrap;
  }

  #resetBtn {
    display: none;
    border: 0;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: clamp(12px, 1.5vw, 16px);
    font-weight: 800;
    background: #eeeeee;
    color: #222;
    cursor: pointer;
  }

  #resetBtn.show {
    display: inline-block;
  }

  #resetBtn:active {
    transform: scale(.98);
  }

  .board-wrap {
    width: min(1536px, 100vw);
  }

  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 1536 / 686;
    background: #fff url("vorlage.png") center top / 100% 100% no-repeat;
    overflow: hidden;
  }

  .answer-field {
    position: absolute;
    z-index: 10;
    margin: 0;
    padding: 2px 5px;
    border: 0;
    outline: none;
    background: transparent;
    color: #222;
    text-align: center;
    font-weight: 800;
    font-size: clamp(11px, 1.35vw, 21px);
    line-height: 1;
    font-family: "Noto Sans KR", "Noto Sans CJK KR", Arial, sans-serif;
  }

  .answer-field:focus {
    background: rgba(255,255,255,.55);
  }

  .answer-field.wrong {
    background: rgba(249, 218, 218, .92);
    color: #7a2222;
  }

  .answer-field.correct {
    background: rgba(220, 244, 224, .95);
    color: #1f5d2a;
  }

  .answer-field.revealed {
    background: rgba(255, 238, 204, .96);
    color: #7a4b00;
  }

  .answer-field[readonly] {
    cursor: default;
  }

  #q7 {
    writing-mode: vertical-rl;
    text-orientation: upright;
    padding: 2px 0;
  }

  .instruction {
    width: min(1536px, 100vw);
    background: #fff;
    text-align: center;
    padding: 10px 12px 14px;
    color: #444;
    font-size: clamp(12px, 1.5vw, 16px);
  }

  .instruction b {
    color: #7a2222;
  }
</style>
</head>

<body>
  <div class="topbar">
    <div class="title">📖 요한계시록 학습 게임</div>

    <div class="score">
      정답: <span id="right">0</span>　오답: <span id="wrong">0</span>
    </div>

    <button id="resetBtn" type="button">🔄 다시 시작 (Reset)</button>
  </div>

  <div class="board-wrap">
    <div class="board">

      <!-- Exactly the 10 red test answers from the source image. -->
      <input class="answer-field" id="q1" lang="ko" autocomplete="off" spellcheck="false"
             data-answer="택함">
      <input class="answer-field" id="q2" lang="ko" autocomplete="off" spellcheck="false"
             data-answer="언약">
      <input class="answer-field" id="q3" lang="ko" autocomplete="off" spellcheck="false"
             data-answer="배도">
      <input class="answer-field" id="q4" lang="ko" autocomplete="off" spellcheck="false"
             data-answer="멸망">
      <input class="answer-field" id="q5" lang="ko" autocomplete="off" spellcheck="false"
             data-answer="심판+구원">
      <input class="answer-field" id="q6" lang="ko" inputmode="numeric" autocomplete="off"
             data-answer="1980.9">
      <input class="answer-field" id="q7" lang="ko" autocomplete="off" spellcheck="false"
             data-answer="이삭교회">
      <input class="answer-field" id="q8" lang="ko" autocomplete="off" spellcheck="false"
             data-answer="나팔">
      <input class="answer-field" id="q9" lang="ko" inputmode="numeric" autocomplete="off"
             data-answer="1984.3">
      <input class="answer-field" id="q10" lang="ko" autocomplete="off" spellcheck="false"
             data-answer="증거장막성전">

    </div>
  </div>

  <div class="instruction">
    정답을 입력한 후 <b>Enter</b> 또는 다른 곳을 눌러 확인하세요.
    처음 틀리면 빨간색으로 표시되고, <b>2번 틀리면 정답이 표시됩니다.</b>
  </div>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/Offenbarung-Lernspiel/service-worker.js");
  }

  const fields = [...document.querySelectorAll(".answer-field")];
  const rightEl = document.getElementById("right");
  const wrongEl = document.getElementById("wrong");
  const resetBtn = document.getElementById("resetBtn");

  let right = 0;
  let wrong = 0;

  function normalize(value) {
    return (value || "")
      .trim()
      .toLowerCase()
      .replace(/\s+/g, "")
      .replace(/[.,:;!?·•~～'"“”‘’]/g, "")
      .replace(/[＋+]/g, "+")
      .replace(/[()（）]/g, "");
  }

  function answersFor(field) {
    const base = normalize(field.dataset.answer);
    const variants = [base];

    if (field.id === "q5") {
      variants.push(normalize("심판 + 구원"));
    }

    return [...new Set(variants)];
  }

  function isFinished(field) {
    return field.readOnly;
  }

  function updateScore() {
    rightEl.textContent = String(right);
    wrongEl.textContent = String(wrong);

    const finished = fields.filter(isFinished).length;
    resetBtn.classList.toggle("show", finished === fields.length);
  }

  function checkField(field) {
    if (field.readOnly) return;

    const entered = normalize(field.value);
    if (!entered) return;

    field.attempts = field.attempts || 0;

    if (answersFor(field).includes(entered)) {
      field.classList.remove("wrong", "revealed");
      field.classList.add("correct");
      field.readOnly = true;
      right++;
      updateScore();
      return;
    }

    field.attempts++;
    wrong++;
    field.classList.remove("correct");
    field.classList.add("wrong");

    if (field.attempts >= 2) {
      field.value = field.dataset.answer;
      field.classList.remove("wrong");
      field.classList.add("revealed");
      field.readOnly = true;
      field.title = "정답이 표시되었습니다.";
    }

    updateScore();
  }

  fields.forEach((field) => {
    field.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        checkField(field);
      }
    });

    field.addEventListener("blur", () => checkField(field));
  });

  resetBtn.addEventListener("click", () => {
    right = 0;
    wrong = 0;

    fields.forEach((field) => {
      field.value = "";
      field.readOnly = false;
      field.attempts = 0;
      field.classList.remove("wrong", "correct", "revealed");
      field.removeAttribute("title");
    });

    resetBtn.classList.remove("show");
    updateScore();
  });

  updateScore();
</script>
</body>
</html>
