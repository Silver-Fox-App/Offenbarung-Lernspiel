<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>요한계시록 학습 게임</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#f3f3f3; font-family:Arial,"Noto Sans CJK KR","NanumGothic",sans-serif; }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  .topbar {
    width:min(1536px,100vw); display:flex; justify-content:space-between; align-items:center;
    padding:10px 14px; background:#fff; position:sticky; top:0; z-index:20;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
  }
  .title { font-size:18px; font-weight:700; }
  .score { font-size:15px; white-space:nowrap; }
  .board-wrap { width:min(1536px,100vw); }
  .board {
    position:relative; width:100%; aspect-ratio:1536/864;
    background:#fff url("vorlage.png") center top / 100% 100% no-repeat;
    overflow:hidden;
  }
  .answer-field {
    position:absolute; z-index:10; margin:0; padding:4px 6px;
    border:0; outline:none; resize:none; overflow:hidden;
    background:transparent; color:#202020;
    text-align:center; font-weight:700;
    font-size:clamp(10px,1.25vw,20px); line-height:1.05;
    font-family:Arial,"Noto Sans CJK KR","NanumGothic",sans-serif;
  }
  .answer-field:focus { background:rgba(255,255,255,.35); }
  .answer-field.correct { background:rgba(218,244,224,.95); color:#1e5f2b; }
  .answer-field.wrong { background:rgba(250,221,221,.96); color:#7a2222; }
  .answer-field[readonly] { cursor:default; }
  .instruction { width:min(1536px,100vw); background:#fff; text-align:center; padding:12px 10px 16px; color:#444; font-size:13px; }

  /* Coordinates match the supplied 1536 × 864 blank Korean template. */
  #qJesus{left:5.3%;top:4.0%;width:14.3%;height:7.2%;}
  #q1{left:1.6%;top:12.2%;width:9.0%;height:8.6%;}

  #qWedding{left:84.4%;top:23.4%;width:11.8%;height:6.2%;}
  #qDate1966{left:4.2%;top:37.3%;width:11.9%;height:6.0%;}
  #qDate1980{left:26.5%;top:37.0%;width:8.7%;height:6.0%;}
  #qDate1984{left:48.6%;top:37.0%;width:9.0%;height:6.0%;}

  #qLetters{left:14.2%;top:48.6%;width:9.8%;height:10.3%;}
  #qNewJohn{left:2.1%;top:60.9%;width:11.6%;height:10.3%;}
  #qSpiritual{left:14.2%;top:60.9%;width:9.8%;height:10.3%;}
  #qTemple{left:23.9%;top:47.1%;width:4.6%;height:25.4%;}
  #qIsaac{left:33.5%;top:47.1%;width:4.6%;height:25.4%;}
  #qCh6{left:25.3%;top:71.3%;width:4.4%;height:6.0%;}
  #qCh7{left:37.4%;top:71.3%;width:4.6%;height:6.0%;}

  #qRevel{left:46.4%;top:46.0%;width:9.7%;height:5.0%;}
  #q10ch{left:39.0%;top:51.0%;width:8.4%;height:5.0%;}
  #qWitness1{left:46.4%;top:51.0%;width:9.7%;height:5.0%;}
  #q11ch{left:39.0%;top:56.0%;width:8.4%;height:5.0%;}
  #qWitness2{left:46.4%;top:56.0%;width:9.7%;height:5.0%;}

  #q19{left:83.3%;top:43.0%;width:13.8%;height:5.7%;}
  #q20{left:83.3%;top:49.5%;width:13.8%;height:5.7%;}
  #q21{left:83.3%;top:56.0%;width:13.8%;height:5.7%;}
  #q22{left:83.3%;top:62.5%;width:13.8%;height:5.7%;}

  #q10{left:61.8%;top:67.4%;width:20.2%;height:8.3%;}

</head>
<body>
  <div class="topbar">
    <div class="title">📖 요한계시록 학습 게임</div>
    <div class="score">정답: <span id="right">0</span>　오답: <span id="wrong">0</span></div>
  </div>

  <div class="board-wrap">
    <div class="board">
      <textarea class="answer-field" id="qJesus" data-answer="예수님"></textarea>
      <textarea class="answer-field" id="q1" data-answer="택함"></textarea>

      <textarea class="answer-field" id="q42" data-answer="42달(3년반)"></textarea>
      <textarea class="answer-field" id="q6" data-answer="1980.9"></textarea>

      <textarea class="answer-field" id="qNewJohn" data-answer="1:9~20 새요한 택함"></textarea>

      <textarea class="answer-field" id="qTemple" data-answer="장막성전"></textarea>
      <textarea class="answer-field" id="qIsaac" data-answer="이삭교회"></textarea>
      <textarea class="answer-field" id="qCh6" data-answer="6장"></textarea>
      <textarea class="answer-field" id="qCh7" data-answer="7장"></textarea>

      <textarea class="answer-field" id="q89" data-answer="8,9장"></textarea>

      <textarea class="answer-field" id="q11ch" data-answer="11장"></textarea>
      <textarea class="answer-field" id="qWitness2" data-answer="증인"></textarea>
      <textarea class="answer-field" id="q1213" data-answer="12,13장"></textarea>
      <textarea class="answer-field" id="qWar" data-answer="전쟁"></textarea>

      <textarea class="answer-field" id="q16" data-answer="16장 대접"></textarea>
      <textarea class="answer-field" id="q17" data-answer="17장 음녀"></textarea>
      <textarea class="answer-field" id="q18" data-answer="18장 바벨론"></textarea>
      <textarea class="answer-field" id="q19" data-answer="19장 혼인"></textarea>

      <textarea class="answer-field" id="q10" data-answer="증거장막성전"></textarea>
    </div>
  </div>
  <div class="instruction">정답을 입력한 후 Enter 또는 다른 곳을 눌러 확인하세요.</div>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/Offenbarung-Lernspiel/service-worker.js");
}

let right=0, wrong=0;
function normalize(v){
  return (v||"").trim().toLowerCase()
    .replace(/\s+/g,"")
    .replace(/[.,:;!?·•~～'"“”‘’]/g,"")
    .replace(/[＋+]/g,"+")
    .replace(/[()（）]/g,"");
}
function fit(field){
  field.style.fontSize="";
  const max=parseFloat(getComputedStyle(field).fontSize);
  let size=max;
  field.style.fontSize=size+"px";
  while(size>9 && (field.scrollHeight>field.clientHeight+2 || field.scrollWidth>field.clientWidth+2)){
    size-=0.5;
    field.style.fontSize=size+"px";
  }
}
function getAnswers(field){
  const a=(field.dataset.answer||"");
  const answers=[a];
  if(field.id==="q4") answers.push("이방에의한선민멸망","이방에의한선민의멸망");
  if(field.id==="q42") answers.push("42달 3년반","42달(3년 반)","42달(3년반)");
  if(field.id==="qApprox7") answers.push("약7년");
  if(field.id==="qSummary") answers.push("1:1-8요약과결론","1:1~8요약과결론");
  if(field.id==="qLetters") answers.push("2,3장편지","2,3장편지");
  if(field.id==="qNewJohn") answers.push("1:9-20새요한택함","1:9~20새요한택함");
  if(field.id==="qSpiritual") answers.push("4,5장영계");
  if(field.id==="q19") answers.push("19장혼인");
  if(field.id==="q20") answers.push("20장부활");
  if(field.id==="q21") answers.push("21장영생");
  if(field.id==="q22") answers.push("22장소생");
  return answers.map(normalize);
}
function checkField(field){
  if(field.readOnly) return;
  const entered=normalize(field.value);
  if(!entered) return;
  if(getAnswers(field).includes(entered)){
    field.classList.remove("wrong");
    field.classList.add("correct");
    field.readOnly=true;
    right++;
    document.getElementById("right").textContent=right;
  }else{
    field.classList.remove("correct");
    field.classList.add("wrong");
    wrong++;
    document.getElementById("wrong").textContent=wrong;
  }
}
document.querySelectorAll('.answer-field').forEach(f=>{
  f.addEventListener('input',()=>fit(f));
  f.addEventListener('keydown',e=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); checkField(f); }
  });
  f.addEventListener('blur',()=>checkField(f));
  f.addEventListener('focus',()=>fit(f));
});
</script>
</body>
</html>
