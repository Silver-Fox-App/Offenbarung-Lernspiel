<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>요한계시록 학습 게임</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f2f2f2;font-family:Arial,"Noto Sans KR","Noto Sans CJK KR",sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center}
.topbar{width:min(1536px,100vw);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.title{font-size:clamp(15px,2vw,23px);font-weight:800}
.score{font-size:clamp(12px,1.45vw,17px);white-space:nowrap}
#resetBtn{display:none;border:1px solid #999;border-radius:10px;background:#fff;color:#222;padding:8px 12px;font-size:clamp(12px,1.45vw,16px);font-weight:800;cursor:pointer;white-space:nowrap}
#resetBtn.show{display:inline-block}
.board-wrap{width:min(1536px,100vw)}
.board{position:relative;width:100%;aspect-ratio:1536/864;background:#fff url("vorlage.png") center/100% 100% no-repeat;overflow:hidden}
.answer-field{position:absolute;z-index:20;margin:0;padding:2px 4px;border:0;outline:none;background:transparent;color:#222;text-align:center;font-family:"Noto Sans KR","Noto Sans CJK KR",Arial,sans-serif;font-weight:800;font-size:clamp(9px,1.18vw,18px);line-height:1.08;border-radius:3px;cursor:text;pointer-events:auto}
.answer-field:focus{background:rgba(255,255,255,.80)}
.answer-field.wrong{background:rgba(249,218,218,.96);color:#7a2222}
.answer-field.correct{background:rgba(220,244,224,.96);color:#1f5d2a}
.answer-field.revealed{background:rgba(255,238,204,.97);color:#7a4b00}
.answer-field[readonly]{cursor:default}
.cover{background:rgba(255,255,255,.97);border:1px solid #222}
.vertical{writing-mode:vertical-rl;text-orientation:upright;padding:3px 0}
.small{font-size:clamp(8px,1.0vw,15px)}
.tiny{font-size:clamp(8px,.88vw,14px)}
.long{font-size:clamp(8px,.92vw,15px)}
.instruction{width:min(1536px,100vw);padding:9px 10px 13px;background:#fff;color:#444;text-align:center;font-size:clamp(11px,1.3vw,15px)}
.instruction strong{color:#7a2222}
</style>
</head>
<body>
<div class="topbar">
  <div class="title">📖 요한계시록 학습 게임</div>
  <div class="score">정답: <span id="right">0</span>　오답: <span id="wrong">0</span></div>
  <button id="resetBtn" type="button">🔄 다시 시작 (Reset)</button>
</div>

<div class="board-wrap"><div class="board">
  <input class="answer-field" id="f1"  lang="ko" autocomplete="off" spellcheck="false" data-answer="예수님">
  <input class="answer-field" id="f2"  lang="ko" autocomplete="off" spellcheck="false" data-answer="택함">
  <input class="answer-field" id="f3"  lang="ko" autocomplete="off" spellcheck="false" data-answer="언약">
  <input class="answer-field" id="f4"  lang="ko" autocomplete="off" spellcheck="false" data-answer="선민">
  <input class="answer-field" id="f5"  lang="ko" autocomplete="off" spellcheck="false" data-answer="배도">
  <input class="answer-field cover" id="f6"  lang="ko" autocomplete="off" spellcheck="false" data-answer="약 14년">

  <input class="answer-field small" id="f7"  lang="ko" autocomplete="off" spellcheck="false" data-answer="이방에 의한 선민 멸망">
  <input class="answer-field" id="f8"  lang="ko" autocomplete="off" spellcheck="false" data-answer="42달(3년 반)">

  <input class="answer-field" id="f9"  lang="ko" autocomplete="off" spellcheck="false" data-answer="멸망자">
  <input class="answer-field long" id="f10" lang="ko" autocomplete="off" spellcheck="false" data-answer="심판+구원">
  <input class="answer-field" id="f11" lang="ko" autocomplete="off" spellcheck="false" data-answer="약 7년">
  <input class="answer-field" id="f12" lang="ko" autocomplete="off" spellcheck="false" data-answer="혼인잔치">

  <input class="answer-field" id="f13" lang="ko" inputmode="decimal" autocomplete="off" data-answer="1966.3">
  <input class="answer-field" id="f14" lang="ko" inputmode="decimal" autocomplete="off" data-answer="1980.9">
  <input class="answer-field" id="f15" lang="ko" inputmode="decimal" autocomplete="off" data-answer="1984.3">
  <input class="answer-field" id="f16" lang="ko" inputmode="numeric"  autocomplete="off" data-answer="1991">

  <input class="answer-field small" id="f17" lang="ko" autocomplete="off" spellcheck="false" data-answer="1:1~8 요약과 결론">
  <input class="answer-field small" id="f18" lang="ko" autocomplete="off" spellcheck="false" data-answer="2, 3장 편지">
  <input class="answer-field small" id="f19" lang="ko" autocomplete="off" spellcheck="false" data-answer="1:9~20 새요한의 택함">
  <input class="answer-field small" id="f20" lang="ko" autocomplete="off" spellcheck="false" data-answer="4, 5장 영계">

  <input class="answer-field vertical" id="f21" lang="ko" autocomplete="off" spellcheck="false" data-answer="성막성전">
  <input class="answer-field vertical" id="f22" lang="ko" autocomplete="off" spellcheck="false" data-answer="이삭교회">

  <input class="answer-field" id="f23" lang="ko" inputmode="numeric" autocomplete="off" data-answer="6">
  <input class="answer-field" id="f24" lang="ko" inputmode="numeric" autocomplete="off" data-answer="7">

  <input class="answer-field tiny" id="f25" lang="ko" autocomplete="off" spellcheck="false" data-answer="8, 9장">
  <input class="answer-field" id="f26" lang="ko" autocomplete="off" spellcheck="false" data-answer="나팔">
  <input class="answer-field tiny" id="f27" lang="ko" autocomplete="off" spellcheck="false" data-answer="10장">
  <input class="answer-field" id="f28" lang="ko" autocomplete="off" spellcheck="false" data-answer="계시">
  <input class="answer-field tiny" id="f29" lang="ko" autocomplete="off" spellcheck="false" data-answer="11장">
  <input class="answer-field" id="f30" lang="ko" autocomplete="off" spellcheck="false" data-answer="증인">
  <input class="answer-field tiny" id="f31" lang="ko" autocomplete="off" spellcheck="false" data-answer="12, 13장">
  <input class="answer-field" id="f32" lang="ko" autocomplete="off" spellcheck="false" data-answer="전쟁">

  <input class="answer-field tiny" id="f33" lang="ko" autocomplete="off" spellcheck="false" data-answer="16장 대접">
  <input class="answer-field tiny" id="f34" lang="ko" autocomplete="off" spellcheck="false" data-answer="17장 음녀">
  <input class="answer-field tiny" id="f35" lang="ko" autocomplete="off" spellcheck="false" data-answer="18장 바벨론">

  <input class="answer-field tiny" id="f36" lang="ko" autocomplete="off" spellcheck="false" data-answer="19장 혼인">
  <input class="answer-field tiny" id="f37" lang="ko" autocomplete="off" spellcheck="false" data-answer="20장 부활">
  <input class="answer-field tiny" id="f38" lang="ko" autocomplete="off" spellcheck="false" data-answer="21장 영생">
  <input class="answer-field tiny" id="f39" lang="ko" autocomplete="off" spellcheck="false" data-answer="22장 소성">

  <input class="answer-field" id="f40" lang="ko" autocomplete="off" spellcheck="false" data-answer="14, 15장">
  <input class="answer-field long" id="f41" lang="ko" autocomplete="off" spellcheck="false" data-answer="증거장막성전">
</div></div>

<div class="instruction">빈칸에 정답을 입력하세요. 1번 틀리면 <strong>빨간색</strong>으로 표시되고, 2번 틀리면 <strong>정답이 표시됩니다.</strong> 모든 칸을 완료하면 Reset으로 다시 시작할 수 있습니다.</div>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/Offenbarung-Lernspiel/service-worker.js");
}

const fields=[...document.querySelectorAll('.answer-field')];
const rightEl=document.getElementById('right');
const wrongEl=document.getElementById('wrong');
const resetBtn=document.getElementById('resetBtn');
let right=0, wrong=0;

const POS={
 f1:[5.25,6.4,14.35,6.8],
 f2:[1.55,13.8,9.2,7.7],
 f3:[12.05,13.8,8.95,7.0],
 f4:[14.25,22.0,6.8,7.7],
 f5:[21.25,22.0,9.6,7.3],
 f6:[14.0,31.0,11.0,4.2],
 f7:[33.0,14.2,19.5,12.0],
 f8:[35.3,26.3,15.1,5.5],
 f9:[65.3,20.3,9.2,6.2],
 f10:[74.5,15.9,23.6,8.4],
 f11:[61.7,28.1,10.0,6.0],
 f12:[84.0,28.0,12.1,6.0],
 f13:[4.55,39.8,12.45,5.8],
 f14:[25.15,39.8,11.0,5.8],
 f15:[48.4,39.8,11.0,5.8],
 f16:[75.9,39.8,6.9,5.8],
 f17:[2.05,49.8,11.2,10.5],
 f18:[13.75,49.8,9.4,10.5],
 f19:[2.05,61.4,11.2,10.5],
 f20:[13.75,61.4,9.4,10.5],
 f21:[23.75,47.0,4.9,24.0],
 f22:[33.45,47.0,4.9,24.0],
 f23:[26.7,72.2,4.7,6.2],
 f24:[36.9,72.2,4.7,6.2],
 f25:[37.5,47.3,8.8,5.0],
 f26:[46.5,47.3,9.7,5.0],
 f27:[37.5,52.5,8.8,5.0],
 f28:[46.5,52.5,9.7,5.0],
 f29:[37.5,57.7,8.8,5.0],
 f30:[46.5,57.7,9.7,5.0],
 f31:[37.5,62.9,8.8,5.0],
 f32:[46.5,62.9,9.7,5.0],
 f33:[61.0,47.8,11.2,6.0],
 f34:[61.0,54.0,11.2,6.0],
 f35:[61.0,60.0,14.3,6.0],
 f36:[82.9,44.8,13.7,6.0],
 f37:[82.9,51.2,13.7,6.0],
 f38:[82.9,57.7,13.7,6.0],
 f39:[82.9,64.2,13.7,6.0],
 f40:[45.4,89.0,16.8,5.8],
 f41:[63.8,89.0,23.5,6.5]
};

for(const[id,p] of Object.entries(POS)){
  const f=document.getElementById(id);
  f.style.left=p[0]+'%'; f.style.top=p[1]+'%'; f.style.width=p[2]+'%'; f.style.height=p[3]+'%';
}

function normalize(v){
  return (v||'').trim().toLowerCase()
    .replace(/\s+/g,'')
    .replace(/[.,:;!?·•~～'"“”‘’]/g,'')
    .replace(/[＋+]/g,'+')
    .replace(/[()（）]/g,'');
}

function isCorrect(field){
  const e=normalize(field.value), a=normalize(field.dataset.answer);
  if(e===a) return true;
  if(field.id==='f8' && (e===normalize('42달3년반') || e===normalize('42달(3년반)'))) return true;
  if(field.id==='f25' && e===normalize('8,9장')) return true;
  if(field.id==='f31' && e===normalize('12,13장')) return true;
  return false;
}

function updateUI(){
  rightEl.textContent=right;
  wrongEl.textContent=wrong;
  resetBtn.classList.toggle('show', fields.every(f=>f.readOnly));
}

function fitText(field){
  const len=(field.value||'').length;
  let size=Math.max(9,Math.min(18,18-(Math.max(0,len-7)*0.8)));
  if(field.classList.contains('small')) size=Math.max(8,Math.min(15,16-(Math.max(0,len-8)*0.65)));
  if(field.classList.contains('tiny')) size=Math.max(8,Math.min(14,15-(Math.max(0,len-7)*0.6)));
  field.style.fontSize=size+'px';
}

function checkField(field){
  if(field.readOnly || !field.value.trim()) return;
  field.attempts=field.attempts||0;
  fitText(field);

  if(isCorrect(field)){
    field.classList.remove('wrong','revealed');
    field.classList.add('correct');
    field.readOnly=true;
    right++;
    updateUI();
    return;
  }

  field.attempts++;
  wrong++;
  field.classList.remove('correct');
  field.classList.add('wrong');

  if(field.attempts>=2){
    field.value=field.dataset.answer;
    fitText(field);
    field.classList.remove('wrong');
    field.classList.add('revealed');
    field.readOnly=true;
  }
  updateUI();
}

fields.forEach(field=>{
  field.addEventListener('input',()=>fitText(field));
  field.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();checkField(field);}
  });
  field.addEventListener('blur',()=>checkField(field));
});

resetBtn.addEventListener('click',()=>{
  right=0; wrong=0;
  fields.forEach(field=>{
    field.value=''; field.readOnly=false; field.attempts=0;
    field.classList.remove('wrong','correct','revealed');
    field.style.fontSize='';
  });
  updateUI();
  fields[0].focus();
});

updateUI();
</script>
</body>
</html>
