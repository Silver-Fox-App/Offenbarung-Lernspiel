<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>요한계시록 학습 게임</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#f4f4f4;font-family:Arial,"Noto Sans KR",sans-serif}body{min-height:100vh;display:flex;flex-direction:column;align-items:center}.topbar{width:min(1536px,100vw);display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.08)}.title{font-size:18px;font-weight:700}.score{font-size:15px}.board-wrap{width:min(1536px,100vw)}.board{position:relative;width:100%;aspect-ratio:1536/864;background:#fff url("vorlage.jpg") center top/100% 100% no-repeat;overflow:hidden}.answer-field{position:absolute;border:2px solid #444;background:rgba(255,255,255,.97);color:#222;border-radius:5px;padding:4px 8px;text-align:center;font-weight:700;font-size:clamp(11px,1.35vw,21px);line-height:1.1;outline:none;resize:none;overflow:hidden;z-index:10}.answer-field:focus{border-color:#333;background:#fff}.answer-field.correct{background:#dff3e3;border-color:#7db88a;color:#1f5d2a;font-weight:800}.answer-field.wrong{background:#f8dede;border-color:#c98a8a;color:#7a2222}.answer-field[readonly]{cursor:default}
#qJesus{left:7.0%;top:.7%;width:13.8%;height:6%;border:0;background:rgba(255,255,255,.88);font-size:clamp(13px,1.55vw,24px)}
#q1{left:4.1%;top:7.1%;width:6.8%;height:7.4%}#q2{left:11.9%;top:7.1%;width:6.9%;height:7.4%}#q3{left:32.2%;top:14.8%;width:7%;height:7.6%}#q4{left:40.7%;top:14.8%;width:7.7%;height:7.6%}#q5{left:77.6%;top:11.8%;width:16.8%;height:7.7%}#q6{left:25.2%;top:29.6%;width:7%;height:7.4%}#q7{left:32%;top:35%;width:6.7%;height:13.5%}#q8{left:45.8%;top:30.3%;width:6.7%;height:7.6%}#q9{left:46.4%;top:27%;width:7%;height:7.3%}#q10{left:58.2%;top:67.7%;width:18.1%;height:8%}.hint{width:min(1536px,100vw);background:#fff;padding:10px 14px 14px;font-size:13px;color:#444;text-align:center}
</style></head>
<body>
<div class="topbar"><div class="title">📖 요한계시록 학습 게임</div><div class="score">정답: <span id="right">0</span> &nbsp; 오답: <span id="wrong">0</span></div></div>
<div class="board-wrap"><div class="board">
<input class="answer-field" id="qJesus" data-answer="예수님" placeholder="예수님">
<input class="answer-field" id="q1" data-answer="택함"><input class="answer-field" id="q2" data-answer="언약"><input class="answer-field" id="q3" data-answer="배도"><input class="answer-field" id="q4" data-answer="멸망"><input class="answer-field" id="q5" data-answer="심판+구원"><input class="answer-field" id="q6" data-answer="1980.9"><input class="answer-field" id="q7" data-answer="이삭교회"><input class="answer-field" id="q8" data-answer="나팔"><input class="answer-field" id="q9" data-answer="1984.3"><input class="answer-field" id="q10" data-answer="증거장막성전">
</div></div><div class="hint">정답을 입력한 후 Enter 또는 다른 곳을 눌러 확인하세요.</div>
<script>
if("serviceWorker"in navigator){navigator.serviceWorker.register("/Offenbarung-Lernspiel/service-worker.js")}
let right=0,wrong=0;function normalize(v){return(v||"").trim().toLowerCase().replace(/\s+/g,"").replace(/[.,:;!?·•]/g,"").replace(/[＋+]/g,"+")}function checkField(f){if(f.readOnly)return;const e=normalize(f.value),a=normalize(f.dataset.answer);if(!e)return;if(e===a){f.classList.remove("wrong");f.classList.add("correct");f.readOnly=true;right++;document.getElementById("right").textContent=right}else{f.classList.remove("correct");f.classList.add("wrong");wrong++;document.getElementById("wrong").textContent=wrong}}document.querySelectorAll(".answer-field").forEach(f=>{f.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();checkField(f)}});f.addEventListener("blur",()=>checkField(f))});
</script></body></html>
