<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Offenbarungs-Lernspiel</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,"Noto Sans",sans-serif;
  background:#f4f4f4;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.menu{
  width:min(600px,100%);
  background:#ffffff;
  border-radius:24px;
  padding:40px 25px;
  text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,.12);
}

h1{
  margin:0 0 12px;
  font-size:clamp(28px,6vw,42px);
}

.subtitle{
  margin:0 0 30px;
  color:#555;
  font-size:clamp(16px,3.5vw,20px);
}

.language-title{
  margin-bottom:20px;
  font-size:20px;
  font-weight:700;
}

.language-buttons{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.language-buttons a{
  display:block;
  text-decoration:none;
  padding:17px 20px;
  border-radius:14px;
  font-size:20px;
  font-weight:700;
  color:#222;
  background:#eeeeee;
  transition:.15s;
}

.language-buttons a:hover{
  transform:translateY(-2px);
  box-shadow:0 4px 12px rgba(0,0,0,.12);
}

.footer{
  margin-top:28px;
  color:#777;
  font-size:14px;
}
</style>
</head>

<body>

<div class="menu">

  <h1>📖 Offenbarungs-Lernspiel</h1>

  <p class="subtitle">
    Digitales Lernspiel zur Offenbarung
  </p>

  <div class="language-title">
    Wähle deine Sprache
  </div>

  <div class="language-buttons">

    <a href="Offb-Lernspiel-URL_DE/">
      🇩🇪 Deutsch
    </a>

    <a href="Offb-Lernspiel-URL_EN/">
      🇬🇧 English
    </a>

    <a href="Offb-Lernspiel-URL_KO/">
      🇰🇷 한국어
    </a>

  </div>

  <div class="footer">
    Offenbarungs-Lernspiel
  </div>

</div>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/Offenbarung-Lernspiel/service-worker.js");
}
</script>

</body>
</html>
