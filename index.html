<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Offenbarungs-Lernspiel</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:#f5ead0;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
}

.menu{
  position:relative;
  width:min(100vw,1214px);
}

.menu img{
  display:block;
  width:100%;
  height:auto;
}

/* Unsichtbare echte Klickflächen */

.language-button{
  position:absolute;
  left:25%;
  width:50%;
  height:9%;
  background:transparent;
  border:0;
  cursor:pointer;
}

/* Positionen der drei Buttons */

.deutsch{
  top:57%;
}

.english{
  top:66%;
}

.korean{
  top:75%;
}

.language-button:focus{
  outline:3px solid rgba(180,140,40,.7);
  border-radius:30px;
}
</style>
</head>

<body>

<div class="menu">

  <img src="hauptmenue.png" alt="Offenbarungs-Lernspiel">

  <a class="language-button deutsch"
     href="Offb-Lernspiel-URL_DE/"
     aria-label="Deutsch"></a>

  <a class="language-button english"
     href="Offb-Lernspiel-URL_EN/"
     aria-label="English"></a>

  <a class="language-button korean"
     href="Offb-Lernspiel-URL_KO/"
     aria-label="한국어"></a>

</div>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/Offenbarung-Lernspiel/service-worker.js");
}
</script>

</body>
</html>
