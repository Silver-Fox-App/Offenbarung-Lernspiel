<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offenbarungs-Lernspiel</title>
<style>
    :root {
        --green: #dff2df;
        --green-border: #86b986;
        --red: #f8dddd;
        --red-border: #cf8f8f;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        background: #f4f4f4;
        font-family: Arial, Helvetica, sans-serif;
        color: #222;
    }

    .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(255,255,255,.97);
        border-bottom: 1px solid #d7d7d7;
        padding: 10px 14px;
        text-align: center;
    }

    .topbar h1 {
        margin: 0 0 4px;
        font-size: 20px;
    }

    .topbar p {
        margin: 0;
        font-size: 13px;
        color: #666;
    }

    .board-wrap {
        padding: 8px;
    }

    /*
      The blank reference image is 1536 x 864 px.
      Every input field below is positioned on top of the corresponding
      blank box in that image.
    */
    .board {
        position: relative;
        width: min(100%, 1536px);
        margin: 0 auto;
        aspect-ratio: 1536 / 864;
        background: #fff;
        overflow: hidden;
    }

    .board > img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        display: block;
    }

    .answer-field {
        position: absolute;
        border: 0;
        outline: none;
        background: rgba(255,255,255,0.02);
        color: #222;
        caret-color: #222;
        padding: 5px 7px;
        text-align: center;
        font-size: clamp(9px, 1.05vw, 17px);
        line-height: 1.12;
        border-radius: 9px;
        cursor: text;
        transition: background .15s ease, border-color .15s ease;
    }

    .answer-field:focus {
        background: rgba(255,255,255,.92);
        box-shadow: inset 0 0 0 2px rgba(90,120,90,.25);
    }

    .answer-field.correct {
        background: var(--green);
        color: #1d4d1d;
        font-weight: 700;
        box-shadow: inset 0 0 0 1.5px var(--green-border);
        font-weight: 700;
        cursor: default;
    }

    .answer-field.wrong {
        background: var(--red);
        color: #222;
        box-shadow: inset 0 0 0 1.5px var(--red-border);
    }

    .answer-field::placeholder {
        color: transparent;
    }

    .counter {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 30;
        background: rgba(255,255,255,.95);
        border: 1px solid #ccc;
        border-radius: 12px;
        padding: 8px 11px;
        font-size: 13px;
        box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .hint {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 30;
        background: rgba(255,255,255,.95);
        border: 1px solid #ccc;
        border-radius: 12px;
        padding: 8px 11px;
        font-size: 12px;
        color: #555;
    }

    @media (max-width: 700px) {
        .topbar h1 { font-size: 17px; }
        .topbar p { font-size: 11px; }
        .board-wrap { padding: 2px; }
        .counter, .hint { font-size: 11px; }
    }

    .answer-field {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
    }
    .answer-field::placeholder { color: transparent; }

</style>
</head>

<body>

<div class="topbar">
    <h1>📖 Offenbarungs-Lernspiel</h1>
    <p>Schreibe die Antwort in die Kästchen. Richtig = hellgrün · Falsch = hellrot</p>
</div>

<div class="board-wrap">
    <div class="board" id="board">
        <img src="vorlage.png" alt="Leere Lernzeitleiste">

        <!--
          x/y/w/h are based on the 1536 x 864 reference image.
          "answer" is the accepted correct answer.
        -->
    </div>
</div>

<div class="hint">Tipp: Groß-/Kleinschreibung und viele Satzzeichen sind egal.</div>
<div class="counter" id="counter">✅ 0 &nbsp; ❌ 0</div>

<script>
const fields = [
    // x, y, width, height, answer
    [81, 40, 221, 55, "Jesus"],

    [28, 106, 138, 74, "1) Auserwählung"],
    [188, 106, 135, 73, "2) Bund"],
    [218, 189, 111, 63, "Auserwähltes Volk"],
    [329, 187, 151, 62, "3) Abfall"],

    [509, 111, 302, 108, "4) Zerstörung des auserwählten Volkes durch die Heiden"],
    [543, 231, 237, 45, "42 Monate (3 ½)"],

    [1009, 169, 148, 53, "Zerstörer"],
    [1165, 136, 348, 81, "5) Gericht + Errettung"],
    [957, 241, 169, 52, "Ca. 7 Jahre"],
    [1293, 242, 195, 56, "Hochzeitsfest"],

    [70, 326, 171, 53, "März 1966"],
    [406, 327, 172, 53, "6) Sept 1980"],
    [748, 327, 154, 53, "9) März 1984"],
    [1167, 328, 101, 51, "1991"],

    [31, 421, 174, 95, "1:1-8 Zusammenfassung & Schlussfolgerung"],
    [214, 420, 145, 95, "2, 3 Briefe"],
    [31, 526, 174, 95, "1:9-20 Auserwählung des neuen Johannes"],
    [214, 526, 145, 95, "4, 5 Geistliche Welt"],

    [368, 388, 69, 219, "Tempel des Zeltes"],
    [513, 388, 70, 219, "7) Isaak Gemeinde"],

    [411, 620, 72, 51, "6"],
    [566, 620, 71, 51, "7"],

    [591, 398, 129, 44, "8, 9"],
    [718, 397, 155, 45, "8) Posaunen"],
    [591, 442, 259, 43, "10 Offenbarung"],
    [591, 486, 259, 44, "11 Zeuge"],
    [591, 531, 259, 44, "12, 13 Krieg"],

    [939, 398, 178, 54, "16 Schalen"],
    [939, 452, 178, 52, "17 Hure"],
    [939, 505, 215, 56, "18 Babylon"],

    [1278, 370, 214, 51, "19 Hochzeit"],
    [1278, 431, 214, 52, "20 Auferstehung"],
    [1278, 495, 214, 52, "21 Ewiges Leben"],
    [1278, 557, 214, 54, "22 Heilung"],

    [685, 771, 228, 46, "14, 15"],
    [946, 756, 313, 67, "10) Tempel des Zeltes des Zeugnisses"]
];

const board = document.getElementById("board");
const counter = document.getElementById("counter");

let right = 0;
let wrong = 0;

function normalize(s) {
    return s
        .toLowerCase()
        .replace(/ä/g, "ae")
        .replace(/ö/g, "oe")
        .replace(/ü/g, "ue")
        .replace(/ß/g, "ss")
        .replace(/[–—-]/g, " ")
        .replace(/[.:,;!?()]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}

/*
  A deliberately forgiving comparison:
  - ignores case
  - ignores punctuation
  - accepts small whitespace variations
  - accepts "3,5" / "3 ½" / "3 1/2" for the 3½ answer
*/
function isCorrect(userText, answer) {
    const u = normalize(userText);
    const a = normalize(answer);

    if (u === a) return true;

    if (answer === "42 Monate (3 ½)") {
        const accepted = [
            "42 monate",
            "42 monate 3 ½",
            "42 monate 3 1/2",
            "42 monate 3,5",
            "42 monate 3.5"
        ];
        return accepted.includes(u);
    }

    // Allow omission of the numbering prefix (e.g. "Auserwählung").
    if (a.includes(" ")) {
        const withoutNumber = a.replace(/^\d+\)\s*/, "");
        if (u === withoutNumber) return true;
    }

    return false;
}


function fitText(el) {
    let size = Math.min(17, Math.max(9, el.clientWidth * 0.055));
    const minSize = 7;
    el.style.fontSize = size + "px";
    while ((el.scrollHeight > el.clientHeight + 2 || el.scrollWidth > el.clientWidth + 2) && size > minSize) {
        size -= 0.5;
        el.style.fontSize = size + "px";
    }
}

function makeField([x, y, w, h, answer], index) {
    const input = document.createElement("textarea");
    input.className = "answer-field";
    input.autocomplete = "off";
    input.wrap = "soft";
    input.spellcheck = false;
    input.rows = 1;
    input.dataset.answer = answer;
    input.dataset.index = index;
    input.setAttribute("aria-label", "Lernfeld " + (index + 1));

    input.style.left = (x / 1536 * 100) + "%";
    input.style.top = (y / 864 * 100) + "%";
    input.style.width = (w / 1536 * 100) + "%";
    input.style.height = (h / 864 * 100) + "%";

    fitText(input);

    input.addEventListener("input", () => fitText(input));

    input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
            checkField(input);
        }
    });

    input.addEventListener("blur", () => {
        if (input.value.trim() !== "" && !input.classList.contains("correct")) {
            checkField(input);
        }
    });

    return input;
}

function checkField(input) {
    if (input.classList.contains("correct")) return;

    fitText(input);
    const ok = isCorrect(input.value, input.dataset.answer);

    if (ok) {
        input.classList.remove("wrong");
        input.classList.add("correct");
        input.readOnly = true;
        right++;
        updateCounter();
    } else {
        input.classList.remove("correct");
        input.classList.add("wrong");
        wrong++;
        updateCounter();
        // Wichtig: Die richtige Lösung wird NICHT eingeblendet.
    }
}

function updateCounter() {
    counter.textContent = `✅ ${right}   ❌ ${wrong}`;
}

fields.forEach((item, index) => {
    const field = makeField(item, index);
    board.appendChild(field);
    requestAnimationFrame(() => fitText(field));
});
window.addEventListener("resize", () => document.querySelectorAll(".answer-field").forEach(fitText));
</script>

</body>
</html>
