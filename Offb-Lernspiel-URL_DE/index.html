<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Offenbarungs-Lernspiel</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f3f3f3;font-family:Arial,"Noto Sans",sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center}
.topbar{
  width:min(1536px,100vw);display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:8px 12px;background:#fff;position:sticky;top:0;z-index:50;
  box-shadow:0 2px 8px rgba(0,0,0,.08)
}
.title{font-size:clamp(15px,2vw,23px);font-weight:800}
.score{font-size:clamp(12px,1.45vw,17px);white-space:nowrap}
#resetBtn{
  display:none;border:1px solid #aaa;border-radius:10px;background:#fff;color:#222;
  padding:8px 12px;font-size:clamp(12px,1.45vw,16px);font-weight:800;cursor:pointer
}
#resetBtn.show{display:inline-block}
.board-wrap{width:min(1536px,100vw)}
.board{
  position:relative;width:100%;aspect-ratio:1536/862;
  background:#fff url("vorlage.png") center/100% 100% no-repeat;
  overflow:hidden
}
.answer-field{
  position:absolute;z-index:20;display:block;margin:0;border:0;outline:none;
  background:transparent;color:#222;text-align:center;
  font-family:Arial,"Noto Sans",sans-serif;font-weight:800;
  font-size:clamp(9px,1.18vw,18px);line-height:1.08;
  padding:2px 4px;border-radius:3px;cursor:text;pointer-events:auto;
}
.answer-field:focus{background:rgba(255,255,255,.72)}
.answer-field.wrong{background:rgba(249,218,218,.96);color:#7a2222}
.answer-field.correct{background:rgba(220,244,224,.96);color:#1f5d2a}
.answer-field.revealed{background:rgba(255,238,204,.97);color:#7a4b00}
.answer-field[readonly]{cursor:default}
.vertical{writing-mode:vertical-rl;text-orientation:upright;padding:3px 0}
.small{font-size:clamp(8px,1.0vw,15px)}
.tiny{font-size:clamp(8px,.88vw,14px)}
.instruction{
  width:min(1536px,100vw);padding:9px 10px 13px;background:#fff;color:#444;
  text-align:center;font-size:clamp(11px,1.3vw,15px)
}
.instruction strong{color:#7a2222}
</style>
</head>
<body>

<div class="topbar">
  <div class="title">📖 Offenbarungs-Lernspiel</div>
  <div class="score">Richtig: <span id="right">0</span>　Falsch: <span id="wrong">0</span></div>
  <button id="resetBtn" type="button">🔄 Neu starten (Reset)</button>
</div>

<div class="board-wrap">
<div class="board">

<!-- Oben -->
<input class="answer-field" id="f1" lang="de" autocomplete="off" spellcheck="false" data-answer="Jesus">

<input class="answer-field" id="f2" lang="de" autocomplete="off" spellcheck="false" data-answer="Auserwählung">
<input class="answer-field" id="f3" lang="de" autocomplete="off" spellcheck="false" data-answer="Bund">
<input class="answer-field" id="f4" lang="de" autocomplete="off" spellcheck="false" data-answer="Auserwähltes Volk">
<input class="answer-field" id="f5" lang="de" autocomplete="off" spellcheck="false" data-answer="Abfall">

<input class="answer-field small" id="f6" lang="de" autocomplete="off" spellcheck="false"
       data-answer="Zerstörung des auserwählten Volkes durch die Heiden">

<input class="answer-field" id="f7" lang="de" autocomplete="off" spellcheck="false"
       data-answer="42 Monate (3 ½)">

<input class="answer-field" id="f8" lang="de" autocomplete="off" spellcheck="false" data-answer="Zerstörer">
<input class="answer-field" id="f9" lang="de" autocomplete="off" spellcheck="false" data-answer="Gericht + Errettung">

<!-- Das ehemals koreanische „약 14년“-Feld ist jetzt leer und lernbar. -->
<input class="answer-field" id="f10" lang="de" autocomplete="off" spellcheck="false" data-answer="Ca. 14 Jahre">

<input class="answer-field" id="f11" lang="de" autocomplete="off" spellcheck="false" data-answer="Ca. 7 Jahre">
<input class="answer-field" id="f12" lang="de" autocomplete="off" spellcheck="false" data-answer="Hochzeitsfest">

<!-- Daten -->
<input class="answer-field" id="f13" lang="de" autocomplete="off" spellcheck="false" data-answer="März 1966">
<input class="answer-field" id="f14" lang="de" autocomplete="off" spellcheck="false" data-answer="Sept 1980">
<input class="answer-field" id="f15" lang="de" autocomplete="off" spellcheck="false" data-answer="März 1984">
<input class="answer-field" id="f16" lang="de" autocomplete="off" spellcheck="false" data-answer="1991">

<!-- Unten links -->
<input class="answer-field small" id="f17" lang="de" autocomplete="off" spellcheck="false"
       data-answer="1:1–8 Zusammenfassung &amp; Schlussfolgerung">
<input class="answer-field small" id="f18" lang="de" autocomplete="off" spellcheck="false"
       data-answer="2, 3 Briefe">
<input class="answer-field small" id="f19" lang="de" autocomplete="off" spellcheck="false"
       data-answer="1:9–20 Auserwählung des neuen Johannes">
<input class="answer-field small" id="f20" lang="de" autocomplete="off" spellcheck="false"
       data-answer="4, 5 Geistliche Welt">

<input class="answer-field vertical" id="f21" lang="de" autocomplete="off" spellcheck="false"
       data-answer="Tempel des Zeltes">
<input class="answer-field vertical" id="f22" lang="de" autocomplete="off" spellcheck="false"
       data-answer="Isaak Gemeinde">

<input class="answer-field" id="f23" lang="de" autocomplete="off" spellcheck="false" data-answer="6">
<input class="answer-field" id="f24" lang="de" autocomplete="off" spellcheck="false" data-answer="7">

<!-- 8,9 / 10 / 11 / 12,13 -->
<input class="answer-field" id="f25" lang="de" autocomplete="off" spellcheck="false" data-answer="8, 9">
<input class="answer-field" id="f26" lang="de" autocomplete="off" spellcheck="false" data-answer="Posaunen">

<input class="answer-field" id="f27" lang="de" autocomplete="off" spellcheck="false" data-answer="10">
<input class="answer-field" id="f28" lang="de" autocomplete="off" spellcheck="false" data-answer="Offenbarung">

<input class="answer-field" id="f29" lang="de" autocomplete="off" spellcheck="false" data-answer="11">
<input class="answer-field" id="f30" lang="de" autocomplete="off" spellcheck="false" data-answer="Zeuge">

<input class="answer-field" id="f31" lang="de" autocomplete="off" spellcheck="false" data-answer="12, 13">
<input class="answer-field" id="f32" lang="de" autocomplete="off" spellcheck="false" data-answer="Krieg">

<!-- 16–18 -->
<input class="answer-field" id="f33" lang="de" autocomplete="off" spellcheck="false" data-answer="16 Schalen">
<input class="answer-field" id="f34" lang="de" autocomplete="off" spellcheck="false" data-answer="17 Hure">
<input class="answer-field" id="f35" lang="de" autocomplete="off" spellcheck="false" data-answer="18 Babylon">

<!-- 19–22 -->
<input class="answer-field" id="f36" lang="de" autocomplete="off" spellcheck="false" data-answer="19 Hochzeit">
<input class="answer-field" id="f37" lang="de" autocomplete="off" spellcheck="false" data-answer="20 Auferstehung">
<input class="answer-field" id="f38" lang="de" autocomplete="off" spellcheck="false" data-answer="21 Ewiges Leben">
<input class="answer-field" id="f39" lang="de" autocomplete="off" spellcheck="false" data-answer="22 Heilung">

<!-- Unten -->
<input class="answer-field" id="f40" lang="de" autocomplete="off" spellcheck="false" data-answer="14, 15">
<input class="answer-field tiny" id="f41" lang="de" autocomplete="off" spellcheck="false"
       data-answer="Tempel des Zeltes des Zeugnisses">

</div>
</div>

<div class="instruction">
  Gib die Antwort in das leere Feld ein.
  Beim <strong>1. Fehler</strong> wird das Feld rot.
  Beim <strong>2. Fehler</strong> wird die richtige Antwort angezeigt.
  Sind alle Felder abgeschlossen, kannst du mit Reset neu beginnen.
</div>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/Offenbarung-Lernspiel/service-worker.js");
}

const fields = [...document.querySelectorAll(".answer-field")];
const rightEl = document.getElementById("right");
const wrongEl = document.getElementById("wrong");
const resetBtn = document.getElementById("resetBtn");

let right = 0;
let wrong = 0;

const POS = {
  f1:[5.2,4.6,14.4,6.1],

  f2:[1.6,12.4,9.0,8.7],
  f3:[12.5,12.4,8.8,8.7],
  f4:[14.3,21.8,7.0,7.4],
  f5:[21.5,21.8,9.6,7.0],

  f6:[33.0,12.9,19.3,13.0],
  f7:[35.4,26.6,14.8,5.3],

  f8:[65.9,19.5,9.2,6.0],
  f9:[76.0,15.7,22.8,8.1],
  f10:[15.6,31.1,12.1,4.2],
  f11:[62.4,28.0,10.7,6.0],
  f12:[84.1,28.0,12.5,6.0],

  f13:[4.7,38.0,12.0,5.9],
  f14:[26.4,38.0,10.9,5.9],
  f15:[48.6,38.0,10.8,5.9],
  f16:[76.0,38.0,6.8,5.9],

  f17:[2.0,48.7,11.3,10.8],
  f18:[13.8,48.7,9.5,10.8],
  f19:[2.0,60.8,11.3,10.8],
  f20:[13.8,60.8,9.5,10.8],

  f21:[24.0,44.8,4.8,25.0],
  f22:[33.3,44.8,4.8,25.0],

  f23:[26.7,71.8,4.7,5.9],
  f24:[36.8,71.8,4.7,5.9],

  f25:[38.5,45.9,8.6,5.3],
  f26:[46.8,45.9,9.8,5.3],
  f27:[38.5,51.1,8.6,5.3],
  f28:[46.8,51.1,9.8,5.3],
  f29:[38.5,56.2,8.6,5.3],
  f30:[46.8,56.2,9.8,5.3],
  f31:[38.5,61.3,8.6,5.3],
  f32:[46.8,61.3,9.8,5.3],

  f33:[61.1,46.0,11.5,6.0],
  f34:[61.1,52.1,11.5,6.0],
  f35:[61.1,58.2,14.2,6.0],

  f36:[83.2,42.6,13.6,6.0],
  f37:[83.2,49.0,13.6,6.0],
  f38:[83.2,56.4,13.6,6.0],
  f39:[83.2,63.8,13.6,6.0],

  f40:[48.5,89.0,14.8,5.5],
  f41:[65.8,87.8,20.7,6.8]
};

for (const [id,p] of Object.entries(POS)) {
  const f = document.getElementById(id);
  f.style.left = p[0] + "%";
  f.style.top = p[1] + "%";
  f.style.width = p[2] + "%";
  f.style.height = p[3] + "%";
}

function normalize(v) {
  return (v || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g, "")
    .replace(/[.,:;!?·•~～'"“”‘’]/g, "")
    .replace(/[＋+]/g, "+")
    .replace(/[()（）]/g, "");
}

function isCorrect(field) {
  const entered = normalize(field.value);
  const answer = normalize(field.dataset.answer);

  if (entered === answer) return true;

  // Tolerant variants for the requested "neuer Johannes" wording.
  if (field.id === "f19") {
    const accepted = [
      "neuer Johannes",
      "neuen Johannes",
      "Auserwählung des neuen Johannes",
      "Auserwählung neuer Johannes"
    ].map(normalize);
    return accepted.includes(entered);
  }

  if (field.id === "f10") {
    return entered === normalize("Ca. 14 Jahre") || entered === normalize("14 Jahre");
  }

  if (field.id === "f11") {
    return entered === normalize("Ca. 7 Jahre") || entered === normalize("7 Jahre");
  }

  if (field.id === "f7") {
    return entered === normalize("42 Monate (3 ½)") ||
           entered === normalize("42 Monate");
  }

  return false;
}

function fitText(field) {
  if (field.classList.contains("vertical")) return;

  let size = parseFloat(getComputedStyle(field).fontSize);
  const minSize = field.classList.contains("small") ? 7 : 8;

  field.style.fontSize = "";
  size = parseFloat(getComputedStyle(field).fontSize);

  while (field.scrollWidth > field.clientWidth + 3 && size > minSize) {
    size -= 0.5;
    field.style.fontSize = size + "px";
  }
}

function updateUI() {
  rightEl.textContent = right;
  wrongEl.textContent = wrong;
  resetBtn.classList.toggle("show", fields.every(f => f.readOnly));
}

function checkField(field) {
  if (field.readOnly || !field.value.trim()) return;

  field.attempts = field.attempts || 0;

  if (isCorrect(field)) {
    field.classList.remove("wrong", "revealed");
    field.classList.add("correct");
    field.readOnly = true;
    fitText(field);
    right++;
    updateUI();
    return;
  }

  field.attempts++;
  wrong++;
  field.classList.remove("correct");
  field.classList.add("wrong");
  fitText(field);

  if (field.attempts >= 2) {
    field.value = field.dataset.answer;
    field.classList.remove("wrong");
    field.classList.add("revealed");
    field.readOnly = true;
    fitText(field);
  }

  updateUI();
}

fields.forEach(field => {
  field.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      checkField(field);
    }
  });

  field.addEventListener("blur", () => checkField(field));

  field.addEventListener("input", () => {
    if (!field.readOnly) fitText(field);
  });
});

resetBtn.addEventListener("click", () => {
  right = 0;
  wrong = 0;

  fields.forEach(field => {
    field.value = "";
    field.readOnly = false;
    field.attempts = 0;
    field.classList.remove("wrong", "correct", "revealed");
    field.style.fontSize = "";
  });

  updateUI();
});

updateUI();
</script>
</body>
</html>
